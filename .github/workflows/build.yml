name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cp dist/index.html collar-replay.html

      - uses: actions/upload-artifact@v7
        with:
          name: collar-replay
          path: collar-replay.html
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: collar-replay

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          gh release create "$TAG" collar-replay.html \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "Built from ${GITHUB_SHA::7}. Download collar-replay.html and upload it to the S3 folder." \
            --latest
